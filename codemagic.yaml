workflows:
  ios-testflight:
    name: Vera iOS → TestFlight
    max_build_duration: 60

    integrations:
      app_store_connect: Vera ASC

    environment:
      groups:
        - ios_signing
      node: 22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Set up code signing
        script: |
          # Decode certificate and install in keychain
          echo $DISTRIBUTION_CERTIFICATE | base64 --decode > /tmp/certificate.p12

          security create-keychain -p "vera2026" build.keychain
          security import /tmp/certificate.p12 -k ~/Library/Keychains/build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "vera2026" ~/Library/Keychains/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "vera2026" ~/Library/Keychains/build.keychain

          # Decode and install provisioning profile
          echo $PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID xml1 - -o - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "6797608152" 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))
        working_directory: ios/App

      - name: Build IPA for App Store
        script: |
          # Extract Team ID from provisioning profile installed earlier
          TEAM_ID=$(security cms -D -i /tmp/profile.mobileprovision | \
            plutil -extract TeamIdentifier.0 xml1 - -o - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')

          cat > /tmp/export_options.plist << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.sebastian.vera</key>
                  <string>Vera AppStore</string>
              </dict>
          </dict>
          </plist>
          PLIST_EOF

          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release \
            --export-options-plist /tmp/export_options.plist \
            --archive-xcargs 'PROVISIONING_PROFILE_SPECIFIER="Vera AppStore"'

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - sebastianfont71@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
