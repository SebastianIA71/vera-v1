workflows:
  ios-testflight:
    name: Vera iOS → TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: Vera ASC   # nombre que pongas en el dashboard de Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sebastian.vera
      node: 20.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set build number (auto-incrementa desde TestFlight)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID")
          agvtool new-version -all $(($LATEST + 1))
        working_directory: ios/App

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - sebastianfont71@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users   # grupo de testers en TestFlight
