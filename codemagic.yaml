workflows:
  ios-testflight:
    name: Vera iOS → TestFlight
    max_build_duration: 60

    environment:
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sebastian.vera
        certificate: $DISTRIBUTION_CERTIFICATE
        certificate_password: $CERTIFICATE_PASSWORD
        provisioning_profile: $PROVISIONING_PROFILE
      node: 20.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "6797608152" || echo "0")
          agvtool new-version -all $(($LATEST + 1))
        working_directory: ios/App

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - sebastianfont71@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
